name: CI

# Two tiers, because the two facts about this project are different shapes.
#
#   static  (ubuntu)  — model-free and Mac-free: syntax, unused imports, and the
#                       backend-free import claim. This tier runs
#                       `benchmarks/backend_free_check.py`, which measures it and
#                       prints its own count, so this header deliberately quotes no
#                       number: a hand-kept figure here would be a second claim to
#                       keep true, and the last one did go stale. If this step
#                       breaks, a Linux or Windows user cannot even install the
#                       thing. Its battery step runs with `mlx`, `mlx_lm` and
#                       `mlx_vlm` unimportable in every child, and two rows
#                       genuinely need that backend — `flash.grammar`'s mask checks
#                       load the tokenizer through `mlx_lm`, and `session_check`'s
#                       chat arm walks past `flash.loop`'s preamble import — so each
#                       prints a REFUSED line carrying the sentence the row died
#                       with, the totals under it are that lane's own subtotal, and
#                       the run exits 0 saying out loud it is NOT a §6 re-read. A
#                       death that names no cause is still a BAD line, which is why
#                       this lane can still be red for a real reason.
#   battery (macos)   — the offline §6 battery, whose printed totals are quoted
#                       in SPEC.md and README.md. It runs on push to main and on
#                       demand rather than on every PR: Apple Silicon runners
#                       cost four times a Linux minute, and a PR that cannot
#                       move a check count should not pay for one. It pre-warms the
#                       fast tier's tokenizer files and no weights, because a runner
#                       that builds its cache from scratch would otherwise print a
#                       cache miss as a failing test.
#
# RUN, AND RED — which is what a job is for. The static tier has executed on a real
# ubuntu runner (run `37102668462`, 2026-10-03) and its *Backend-free import claim*
# step found the one bug a Mac cannot see: `flash.train --selftest` importing
# `mlx_lm.lora` on a platform where `pyproject.toml`'s marker never installs it.
# R-7.16 fixed that at cause and gave the battery its refused-row lane, so this tier
# is a measurement now rather than an author's claim. The macos `battery` job has
# still never executed — `needs: static` skipped it on that run — so its first green
# on a real runner is the proof for that tier, not this file existing here.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The marker on mlx-lm is the whole cross-platform story: on Linux it is
      # not installed, so this step failing would mean `pip install .` is broken
      # for every non-Mac user.
      - name: Install (no MLX on this platform)
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Build the wheel
        run: |
          pip install build
          python -m build
          ls -l dist/

      - name: pyflakes (must print nothing)
        run: python -m pyflakes flash/*.py benchmarks/*.py

      - name: Everything compiles
        run: python -m compileall -q flash benchmarks

      - name: The console script is on PATH
        run: |
          flash --help
          flash --version

      - name: Backend-free import claim
        run: python benchmarks/backend_free_check.py

      - name: Model-free subset of the battery
        run: python benchmarks/battery_reread.py --backend-free

  battery:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-14
    needs: static
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Pre-flight (what this machine can run)
        run: flash doctor

      # R-7.16: `flash.grammar --selftest`'s mask checks load the fast tier's
      # tokenizer and never its weights. The runner said so itself — the nightly
      # job's battery printed `BAD flash.grammar --selftest want 47/47 got
      # ['24/25']` four nights running — and the same cold cache lands on any
      # macos runner that has not run the live suite yet. The pattern list below
      # matches 7 files and 11M — measured here against a throwaway HOME, which is
      # where `flash.grammar --selftest` then printed 47/47 — and without them the §6
      # total is unreachable from CI, a download being reported as a failing test.
      - name: Cache the tokenizer files
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface/hub
          key: hf-tokenizer-qwen25-coder-7b-instruct-4bit

      - name: Pre-warm the tokenizer (no weights)
        run: |
          python - <<'PY'
          from huggingface_hub import snapshot_download
          path = snapshot_download(
              "mlx-community/Qwen2.5-Coder-7B-Instruct-4bit",
              allow_patterns=["tokenizer*", "*.jinja", "chat_template.json",
                              "special_tokens_map.json", "config.json",
                              "generation_config.json", "added_tokens.json",
                              "merges.txt", "vocab.json"])
          print("snapshot:", path)
          PY

      - name: The tokenizer is really there (grammar's mask checks read it)
        run: python benchmarks/battery_reread.py --quick grammar

      - name: Full offline battery against SPEC's printed totals
        run: flash selftest --all

      - name: Save the run so a cited number stays citable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: battery-macos-py3.11
          path: benchmarks/results/ci/
          if-no-files-found: ignore
          retention-days: 30
