repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        files: ^\.github/.*\.ya?ml$
      - id: check-json
        files: (^|/)(package\.json|package-lock\.json|tsconfig[^/]*\.json|\.eslintrc\.json)$
      - id: check-toml
        files: (^|/)(pyproject\.toml|Cargo\.toml)$
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--select=F, --fix]
        files: ^(flash|benchmarks)/[^/]+\.py$
      - id: ruff-format
        files: ^(flash|benchmarks)/[^/]+\.py$

ci:
  autofix_prs: true
  autoupdate_schedule: quarterly
