[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-coder"
description = "A local, verify-first coding agent for Apple Silicon: PERCEIVE -> ROUTE -> small model -> escalate only when the traceback says so, with every claim backed by a run you can re-run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aashish", email = "145881415+aashish254@users.noreply.github.com" }]
keywords = ["coding-agent", "local-llm", "apple-silicon", "mlx", "static-analysis", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "numpy>=1.26",
  "python-lsp-server[pyflakes]>=1.15",
  "requests>=2.31",
  # MLX is Apple Silicon only, and it is marked rather than assumed: with the
  # marker stripped, 24 of the 26 modules still import, which is why a Linux or
  # Windows user gets the perception tools, the graph and the whole offline
  # battery and is told plainly that generation needs a Mac. The two that fail are
  # `flash.decide` (top-level `import mlx.core`) and `flash.route` through it;
  # `flash.cli` imports because it loads both lazily. That split was measured by
  # hand on 2026-09-27 with an import blocker, and `flash doctor` is to report
  # which half a machine is in — both the check
  # (benchmarks/backend_free_check.py) and the command are SPEC R-7.6's open box,
  # so until it closes this comment is a measurement of one number and a promise
  # about the rest.
  "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dynamic = ["version"]

[project.optional-dependencies]
# flash vision --run reads screenshots through a VLM; the rest of the tool runs
# without it and says so rather than crashing on import.
vlm = ["mlx-vlm>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# flash web's doc ranker embeds with bge via torch. Without it `flash web`
# falls back to keyword ranking, which is measured and reported as a fallback.
web = ["transformers>=4.44", "torch>=2.4"]
# What CI and a contributor run: the offline battery needs no model, and
# pyflakes is a gate rather than a suggestion (`python -m pyflakes flash/*.py
# benchmarks/*.py` must print nothing).
dev = ["pyflakes>=3.0", "build>=1.0"]

[project.urls]
Documentation = "https://github.com/aashish254/flash-coder#readme"
Issues = "https://github.com/aashish254/flash-coder/issues"

[project.scripts]
flash = "flash.cli:main"

[tool.setuptools]
packages = ["flash"]

[tool.setuptools.dynamic]
version = { attr = "flash.__version__" }
