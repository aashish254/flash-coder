[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-coder"
description = "A local, verify-first coding agent for Apple Silicon: PERCEIVE -> ROUTE -> small model -> escalate only when the traceback says so, with every claim backed by a run you can re-run."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aashish", email = "145881415+aashish254@users.noreply.github.com" }]
keywords = ["coding-agent", "local-llm", "apple-silicon", "mlx", "static-analysis", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "numpy>=1.26",
  "python-lsp-server[pyflakes]>=1.15",
  "requests>=2.31",
  # MLX is Apple Silicon only, and it is marked rather than assumed. What is
  # MEASURED is the import half, on Apple Silicon with the backend blocked in a child
  # process: every submodule of `flash` still imports (26 of 26) and a generation
  # call is the thing that says MLX is missing. `flash.decide` used to break that at
  # `import mlx.core` (and `flash.route` through it); its forward pass now imports
  # MLX inside the call that needs it (SPEC R-7.7). The claim is gated rather than
  # narrated: `benchmarks/backend_free_check.py` sweeps the package under the blocker
  # and requires the call to explain itself, and `flash doctor` reports which half of
  # the project a machine is holding. What is NOT measured here is a Linux or Windows
  # machine actually installing this file. SPEC R-7.5 closed on the four shapes this
  # box can produce — fresh clone, wheel, editable clone, unpacked sdist, all on Apple
  # Silicon — so this marker is not an open box any more, but it is still a dependency
  # resolver's statement rather than a test report from someone else's platform.
  "mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dynamic = ["version"]

[project.optional-dependencies]
# The name `flash/backend.py`'s Apple-Silicon remedy prints, and the name
# `benchmarks/backend_message_check.py` gates as a literal. It exists so that the
# sentence a user is told to type installs something: with only `[local]` on this
# page, a Mac user reading `pip install 'flash-coder[mac]'` would get
# "Does not provide the extra 'mac'".
# WHAT IT DELIBERATELY DOES NOT DO is move `mlx-lm` out of `dependencies`. Measured
# reason, not taste: `mlx-lm` is already platform-marked there, so a Linux install
# never resolves it and `[mac]` on a non-Mac is a documented no-op; and every
# published §6 number on this Mac — plus CI's and the nightly's live arm, both of
# which run `pip install -e .[dev]` — comes from an install that got MLX from the
# hard dependency. Moving it here would make `pip install .` a Mac install that
# cannot generate, which is a different product than the one README's quickstart
# promises and would re-open R-7.5's four measured install shapes.
mac = ["mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# `flash run-vis-suite` reads screenshots through a VLM; the rest of the tool runs
# without it and says so rather than crashing on import.
vlm = ["mlx-vlm>=0.7; sys_platform == 'darwin' and platform_machine == 'arm64'"]
# flash web's doc ranker embeds with bge via torch. Without it `flash web`
# falls back to keyword ranking, which is measured and reported as a fallback.
web = ["transformers>=4.44", "torch>=2.4"]
# R-1.4's second language. Without it `flash graph --lang ts` prints one refusal
# sentence naming this command and still answers about Python; the pass never
# falls back to string matching. Measured on: tree-sitter 0.26.0 and
# tree-sitter-typescript 0.23.2, the pair `benchmarks/ts_perception_check.py` was
# run green against (47/47 + 13/13 mutants).
ts = ["tree-sitter>=0.25", "tree-sitter-typescript>=0.23"]
# R-7.18: the non-MLX route. `pip install 'flash-coder[local]'`, then
# `flash models pull fast`, then any generating command with `--backend llama.cpp`.
# It is an EXTRA and never a dependency, and what decides that is a measurement of
# the download itself (`https://pypi.org/pypi/llama-cpp-python/json`, 2026-10-15):
# version 0.3.36 is **one file, an sdist, and no wheel for any platform** — so
# installing it runs a C++ compile with whatever toolchain the box happens to have,
# which is a thing a person chooses, not a thing `pip install .` does to them. That
# is also why it is NOT in `dev`: CI would pay that compile on every job, on the Mac
# that runs §6 included. And why there is no platform marker on the line: the
# package itself carries none (`requires-python >=3.8`, one tarball for
# Linux/macOS/Windows), so a marker here would be a claim about a platform the
# measured file does not restrict. `flash doctor` reports which of the two routes
# this box can actually take, and `benchmarks/backend_seam_check.py` gates the
# backend itself offline, because NO llama.cpp generation has been run here.
local = ["llama-cpp-python>=0.3.36"]
# What CI and a contributor run: the offline battery needs no model, and
# pyflakes is a gate rather than a suggestion (`python -m pyflakes flash/*.py
# benchmarks/*.py` must print nothing). It carries the `ts` extra on purpose: two of
# the battery's 37 lines are R-1.4's TypeScript vectors, and a documented install
# command that left a contributor unable to print 2 published lines — or CI red on
# main — would make the battery's own total depend on which page you read. Measured
# on the download itself (`python benchmarks/r75_sdist_battery_check.py`, both shapes):
# a plain `pip install <sdist>` prints every battery line but those two, and both
# refusals name this extra.
dev = ["pyflakes>=3.0", "build>=1.0", "flash-coder[ts]"]

[project.urls]
Documentation = "https://github.com/aashish254/flash-coder#readme"
Issues = "https://github.com/aashish254/flash-coder/issues"

[project.scripts]
flash = "flash.cli:main"

[tool.setuptools]
packages = ["flash"]

[tool.setuptools.dynamic]
version = { attr = "flash.__version__" }
